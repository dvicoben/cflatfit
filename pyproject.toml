[project]
name = "cflatfit"
version = "0.0.0"
authors = [
    {name="David Vico Benet", email="david.vico.benet@cern.ch"}
]
description = "Package for template fits"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "scipy",
    "iminuit",
    "matplotlib",
    "seaborn"
]

[project.urls]
Homepage = "https://github.com/dvicoben/cflatfit.git"

[build-system]
requires = [
    "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"
